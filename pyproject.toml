[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spike-turbovla"
version = "0.1.0"
description = "LIBERO experiments with SDT-V3, frozen SmoothSpike, and spike Cross-attention"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<2",
  "Pillow>=10",
  "safetensors>=0.6",
  "einops>=0.8",
  "timm==1.0.20",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers==4.56.2",
  "spikingjelly==0.0.0.0.14",
  "tqdm>=4.66",
]

[project.optional-dependencies]
libero = [
  "av>=12",
  "bddl==1.0.1",
  "cloudpickle",
  "easydict",
  "gym==0.25.2",
  "h5py>=3.10",
  "imageio[ffmpeg]>=2.34",
  "opencv-python-headless==4.11.0.86",
  "pyarrow>=14",
  "PyOpenGL==3.1.10",
  "PyYAML>=6",
  "robosuite==1.4.0",
]
rlds = ["tensorflow>=2.20", "tensorflow-datasets>=4.9"]
dev = ["ruff>=0.15", "pytest>=8", "build"]

[project.scripts]
spike-turbovla-libero-train = "turbovla.training.train_mixed:main"
spike-turbovla-libero-eval = "vla_adapter.rollout:main"
spike-turbovla-joint = "experiments.libero.run_cross_joint_stage:main"

[tool.setuptools.packages.find]
where = [".", "third_party/vla_adapter", "third_party/starvla_runtime"]
include = [
  "deployment*", "experiments*", "starVLA*", "turbovla*", "vla_adapter*",
  "third_party", "third_party.SmoothSpike*",
]

[tool.setuptools.package-data]
"experiments.libero" = ["configs/*.json"]
"experiments.robotwin" = ["configs/*.json", "configs/*.yaml", "evaluation/*.yml"]
"starVLA.config" = ["deepseeds/*.yaml"]
"third_party" = ["Spike-Driven-Transformer-V3/SDT_V3/Classification/Model_Base/models.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", "build"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
